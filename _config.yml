# GitHub Pages config: renders README.md as a standalone page.
# The primer theme matches GitHub's own markdown styling, so the published page
# looks like the README without the surrounding repository chrome.
theme: jekyll-theme-primer
title: Flexible Graph Construction for Neural Weather Prediction
description: Google Summer of Code 2026 final report, MLLAM

# Source files that are not part of the published page.
exclude:
  - index.qmd
  - verify_measurements.py
  - README.md.bak
